<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>POGO Studios — Live Sequence</title>
<link rel="icon" href="pogo-mark.svg" type="image/svg+xml">
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  :root { --fg: #EFEDE6; --bg: #171512; --splash-bg: #171512; --bar-bg: #171512; --bar-fg: #EFEDE6; }
  body {
    background: var(--bg); color: var(--fg);
    transition: background 0.25s, color 0.25s;
    font-family: 'IBM Plex Mono', ui-monospace, 'Cascadia Code', Menlo, monospace;
    min-height: 100vh; display: flex; flex-direction: column;
  }
  nav {
    border-bottom: 2px solid var(--fg); padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: center;
    flex-wrap: wrap; gap: 12px;
  }
  .mark {
    display: flex; align-items: center; gap: 9px;
    font-size: 12px; letter-spacing: 0.18em; font-weight: 700;
    color: var(--fg); text-decoration: none; opacity: 1;
  }
  .mark img { height: 50px; width: auto; display: block; }
  .mark:hover { opacity: 0.6; }
  @media (max-width: 600px) {
    .mark span { display: none; }
    .mark img { height: 42px; }
  }
  .navlinks { display: flex; gap: 18px; flex-wrap: wrap; align-items: center; }
  .navlinks a {
    color: var(--fg); text-decoration: none; font-size: 10px;
    letter-spacing: 0.14em; opacity: 0.6; padding-bottom: 2px;
    border-bottom: 2px solid transparent;
  }
  .navlinks a:hover { opacity: 1; }
  .navdrop { position: relative; display: flex; align-items: center; }
  .navtrigger {
    font-family: inherit; font-size: 10px; letter-spacing: 0.14em;
    background: none; border: none; padding: 0 0 2px; cursor: pointer;
    display: block; line-height: inherit; font-weight: inherit;
    color: var(--fg); opacity: 0.55; border-bottom: 2px solid transparent;
  }
  .navtrigger:hover, .navdrop.open .navtrigger { opacity: 1; }
  .navdrop.open .navtrigger { border-bottom-color: var(--fg); }
  .navmenu {
    display: none; position: absolute; top: 100%; left: 0; z-index: 60;
    max-width: min(240px, calc(100vw - 32px));
    background: var(--bg); border: 2px solid var(--fg); min-width: 172px; margin-top: 6px;
  }
  .navdrop.open .navmenu { display: block; }
  .navmenu a {
    display: block; width: 100%; text-align: left; padding: 10px 13px;
    font-family: inherit; font-size: 10px; letter-spacing: 0.12em;
    border: none; border-bottom: 1px solid rgba(128,128,128,0.35);
    background: none; color: inherit; opacity: 0.75; cursor: pointer;
  }
  .navmenu a:last-child { border-bottom: none; }
  .navmenu a:hover { opacity: 1; background: rgba(128,128,128,0.16); }

  .navlinks a.here { opacity: 1; border-bottom-color: var(--fg); }

  header {
    border-bottom: 2px solid var(--fg); padding: 14px 24px;
    display: flex; justify-content: space-between; align-items: baseline;
    flex-wrap: wrap; gap: 8px;
  }
  .eyebrow { font-size: 10px; letter-spacing: 0.18em; opacity: 0.5; }
  h1 { font-family: var(--font-display); font-size: 15px; font-weight: 700; margin-top: 4px; letter-spacing: -0.01em; }
  .status { font-size: 10px; letter-spacing: 0.1em; opacity: 0.5; }

  .stage {
    flex: 1; display: flex; align-items: center; justify-content: center;
    padding: 20px; min-height: 300px;
  }
  canvas { max-width: 100%; max-height: 100%; display: block; }

  .panel {
    border-top: 2px solid var(--fg); padding: 14px 24px;
    display: flex; gap: 16px; flex-wrap: wrap; align-items: flex-end;
  }
  .ctl { display: flex; flex-direction: column; gap: 5px; }
  .label { font-size: 10px; letter-spacing: 0.12em; opacity: 0.6; }
  select, button {
    font-family: inherit; font-size: 11px; font-weight: 700;
    letter-spacing: 0.06em; padding: 7px 12px;
    border: 2px solid var(--fg); background: transparent; color: var(--fg); cursor: pointer;
  }
  button.on { background: var(--fg); color: var(--bg); }
  button.rec { border-color: #C4452F; color: #C4452F; }
  button.rec.on { background: #C4452F; color: var(--bg); }
  .idtag {
    position: fixed; bottom: 84px; left: 24px; z-index: 5;
    font-size: 10px; letter-spacing: 0.16em; opacity: 0.35; pointer-events: none;
  }

  /* Clean view — chrome hidden, page stays */
  body.clean nav, body.clean header, body.clean .panel, body.clean .idtag { display: none; }
  body.clean .stage { padding: 0; }
  #exitClean {
    display: none; position: fixed; top: 16px; right: 16px; z-index: 20;
    opacity: 0.35;
  }
  #exitClean:hover { opacity: 1; }
  body.clean #exitClean { display: block; }

  /* Embed mode — for iframes */
  body.embed nav, body.embed header, body.embed .panel,
  body.embed .idtag, body.embed #exitClean { display: none; }
  body.embed .stage { padding: 0; }

  @media (max-width: 900px) {
    nav { padding: 11px 14px; }
    .navlinks {
      flex-wrap: wrap; overflow: visible; gap: 10px 14px; max-width: 100%;
    }
    .navlinks a { white-space: nowrap; font-size: 9.5px; }
    .navmenu a { padding: 13px 14px; font-size: 11px; }
    .navtrigger { font-size: 9.5px; }
    header { padding: 12px 16px; }
    .stage { padding: 12px; min-height: 220px; }
    .panel { padding: 12px 16px; gap: 12px; }
    .ctl { flex: 1 1 45%; }
    select, button { width: 100%; min-height: 38px; }
    .idtag { bottom: 8px; left: 14px; top: auto; font-size: 9px; }
  }

  /* ---------- desktop: nav sits left, menus stay inside the page ---------- */
  nav { justify-content: flex-start; gap: 30px; }
  .navmenu { max-width: 190px; min-width: 158px; }

  /* ---------- mobile: app shell rather than a web nav ---------- */
  .splash {
    position: fixed; inset: 0; z-index: 200; display: none;
    align-items: center; justify-content: center; overflow: hidden;
    background-color: var(--splash-bg, #EFEDE6);
    transition: opacity 0.5s ease;
  }
  /* Artwork sits in its own layer so it can move independently of the mark.
     The drawing radiates outward, so the motion pushes gently outward too. */
  .splash::before {
    content: ""; position: absolute; inset: 0;
    background-image: url('splash.png');
    background-size: cover; background-position: center;
    /* pixel art: keep the squares crisp rather than smoothed */
    image-rendering: pixelated;
    image-rendering: crisp-edges;
  }
  .splash.gone { opacity: 0; pointer-events: none; }

  .appbar { display: none; }

  @media (max-width: 900px) {
    .splash { display: flex; }

    nav { justify-content: center; padding: 10px 14px; gap: 0; }
    nav .navlinks { display: none; }
    .mark { justify-content: center; }

    .appbar {
      display: flex; position: fixed; bottom: 0; left: 0; right: 0; z-index: 90;
      background: var(--bar-bg, #EFEDE6);
      border-top: 2px solid var(--bar-fg, #171512);
      padding-bottom: env(safe-area-inset-bottom, 0px);
    }
    .appbar a {
      flex: 1; text-align: center; text-decoration: none;
      color: var(--bar-fg, #171512); font-size: 9.5px; letter-spacing: 0.1em;
      font-weight: 700; padding: 15px 2px 14px; opacity: 0.45;
      border-right: 1px solid rgba(128,128,128,0.3);
    }
    .appbar a:last-child { border-right: none; }
    .appbar a.here { opacity: 1; }
    .appbar a.here::before {
      content: ""; display: block; height: 2px; width: 22px;
      background: var(--bar-fg, #171512); margin: -15px auto 11px;
    }
    body { padding-bottom: calc(52px + env(safe-area-inset-bottom, 0px)); }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  var OWNER = "POGO-XYZ";
  var REPO = "POGO-ARCHIVE-MEDIA";
  var API = "https://api.github.com/repos/" + OWNER + "/" + REPO + "/contents/";

  var Q = location.search;
  var THEMES = {
    dark:  { bg: "#171512", fg: "#EFEDE6", invert: false },
    paper: { bg: "#EFEDE6", fg: "#171512", invert: true },
    white: { bg: "#FFFFFF", fg: "#171512", invert: true }
  };
  var theme = /[?&]paper/.test(Q) ? "paper" : /[?&]white/.test(Q) ? "white" : "dark";
  var BASE_RAMP = /[?&]pogo/.test(Q) ? "POGO#*+=-:. " : "@%#*+=-:. ";
  var RAMP = BASE_RAMP;
  var BG = THEMES[theme].bg;
  var PAPER = theme !== "dark";

  function applyTheme(name) {
    theme = name;
    var t = THEMES[name];
    BG = t.bg;
    // on light grounds the density ramp reverses so tone reads correctly
    RAMP = t.invert ? BASE_RAMP.split("").reverse().join("") : BASE_RAMP;
    document.documentElement.style.setProperty("--bg", t.bg);
    document.documentElement.style.setProperty("--fg", t.fg);
    document.documentElement.style.setProperty("--bar-bg", t.bg);
    document.documentElement.style.setProperty("--bar-fg", t.fg);
    var st = document.querySelector(".stage");
    if (st) st.style.background = t.bg;
    Array.prototype.forEach.call(document.querySelectorAll("#bgDark,#bgPaper,#bgWhite"), function (b) {
      b.classList.toggle("on", b.id.toLowerCase() === "bg" + name);
    });
    var m = document.querySelector(".mark img");
    if (m) m.src = t.invert ? "pogo-mark.svg" : "pogo-mark-light.svg";
    if (frameB) paint(1);
  }
  var CELL_W = 8, CELL_H = 14;
  var MIN_CELL = 5, MAX_CELL = 15;      // detail ceiling / floor
  var autoQuality = true;
  var frameTimes = [], lastCheck = 0, settleUntil = 0;
  var ASPECT = 9 / 16;

  var BAYER = [[0,8,2,10],[12,4,14,6],[3,11,1,9],[15,7,13,5]];
  var BRAILLE_BITS = [[0x01,0x08],[0x02,0x10],[0x04,0x20],[0x40,0x80]];

  var PACE = {
    slow: { hold: 3800, trans: 3400 },
    mid:  { hold: 2200, trans: 2200 },
    fast: { hold: 1200, trans: 1300 }
  };

  var detailSetting = "auto";
  var cols = 150, rows = 48, subW = 300, subH = 192;

  var canvas = document.getElementById("stage");
  var ctx = canvas.getContext("2d");
  var work = document.createElement("canvas");
  var wctx = work.getContext("2d", { willReadFrequently: true });
  var tiny = document.createElement("canvas");
  tiny.width = 24; tiny.height = 24;
  var tctx = tiny.getContext("2d", { willReadFrequently: true });

  var playlist = [], analyzed = [], played = {};
  var current = null;
  var frameA = null, frameB = null;
  var modeA = "ascii", modeB = "ascii";
  var mixTones = null, mixColors = null;
  var phase = "hold", phaseStart = 0;
  var paused = false, styleMode = "mixed", pace = PACE.mid;
  var imgCache = {}, recorder = null, loadingMore = false, started = false;

  function setStatus(t) { document.getElementById("status").textContent = t; }

  function computeCols() {
    if (detailSetting !== "max" && detailSetting !== "auto") return +detailSetting;
    var stage = document.querySelector(".stage");
    var avail = stage.clientWidth || window.innerWidth;
    // account for stage padding
    var c = Math.floor((avail - 4) / CELL_W);
    return Math.max(80, Math.min(420, c));
  }

  function sizeGrid() {
    cols = computeCols();
    var frameW = cols * CELL_W;
    rows = Math.max(10, Math.round((frameW * ASPECT) / CELL_H));
    // don't exceed available height
    var stage = document.querySelector(".stage");
    var maxRows = Math.floor((stage.clientHeight - 4) / CELL_H);
    if (maxRows > 8 && rows > maxRows) {
      rows = maxRows;
      cols = Math.max(80, Math.round((rows * CELL_H / ASPECT) / CELL_W));
      if (detailSetting !== "max" && detailSetting !== "auto") cols = +detailSetting;
    }
    subW = cols * 2; subH = rows * 4;
    canvas.width = cols * CELL_W;
    canvas.height = rows * CELL_H;
    ctx.font = CELL_H + 'px ui-monospace, "Cascadia Code", Menlo, monospace';
    ctx.textBaseline = "top";
    mixTones = new Float32Array(subW * subH);
    mixColors = new Float32Array(cols * rows * 3);
  }

  function loadArchive() {
    fetch("manifest.json", { cache: "no-cache" })
      .then(function (r) { return r.ok ? r.json() : null; })
      .catch(function () { return null; })
      .then(function (m) {
        if (m && m.works && m.works.length) {
          m.works.forEach(function (w) {
            if (w.media_url) playlist.push({ name: w.id, url: w.media_url });
          });
          return;
        }
        return apiLoad();     // fallback before a manifest is published
      })
      .then(function () {
        if (!playlist.length) throw new Error("no works");
        shuffle(playlist);
        setStatus(playlist.length + " WORKS");
        return fillPool(8);
      })
      .then(start)
      .catch(function () { setStatus("ARCHIVE UNAVAILABLE"); });
  }

  function apiLoad() {
    return fetch(API)
      .then(function (r) { return r.json(); })
      .then(function (items) {
        var years = items.filter(function (i) {
          return i.type === "dir" && /^\d{4}$/.test(i.name);
        }).map(function (i) { return i.name; });
        return Promise.all(years.map(function (y) {
          return fetch(API + y).then(function (r) { return r.json(); });
        }));
      })
      .then(function (folders) {
        folders.forEach(function (files) {
          if (!Array.isArray(files)) return;
          files.forEach(function (f) {
            if (f.type === "file" && /\.(jpe?g|png|webp)$/i.test(f.name)) {
              playlist.push({ name: f.name.replace(/\.[^.]+$/, ""), url: f.download_url });
            }
          });
        });
      });
  }

  function shuffle(a) {
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
  }

  function getImage(entry) {
    if (imgCache[entry.url]) return Promise.resolve(imgCache[entry.url]);
    return new Promise(function (res, rej) {
      var img = new Image();
      img.crossOrigin = "anonymous";
      img.onload = function () { imgCache[entry.url] = img; res(img); };
      img.onerror = rej;
      img.src = entry.url;
    });
  }

  function signature(img) {
    tctx.drawImage(img, 0, 0, 24, 24);
    var d = tctx.getImageData(0, 0, 24, 24).data;
    var r = 0, g = 0, b = 0, l = 0, n = 576, lums = new Float32Array(n);
    for (var i = 0; i < n; i++) {
      var k = i * 4;
      r += d[k]; g += d[k+1]; b += d[k+2];
      var lum = 0.2126*d[k] + 0.7152*d[k+1] + 0.0722*d[k+2];
      lums[i] = lum; l += lum;
    }
    r/=n; g/=n; b/=n; l/=n;
    var v = 0;
    for (var j = 0; j < n; j++) { var dd = lums[j]-l; v += dd*dd; }
    return { r:r, g:g, b:b, l:l, c:Math.sqrt(v/n) };
  }

  function distance(a, b) {
    var dl=(a.l-b.l)/255, dc=(a.c-b.c)/128;
    var dr=(a.r-b.r)/255, dg=(a.g-b.g)/255, db=(a.b-b.b)/255;
    return Math.sqrt(dl*dl*3 + dc*dc*1.5 + dr*dr + dg*dg + db*db);
  }

  function fillPool(n) {
    if (loadingMore) return Promise.resolve();
    loadingMore = true;
    var batch = [];
    for (var i = 0; i < playlist.length && batch.length < n; i++) {
      var e = playlist[i];
      if (!e._seen) { e._seen = true; batch.push(e); }
    }
    return Promise.all(batch.map(function (e) {
      return getImage(e).then(function (img) {
        e.sig = signature(img);
        analyzed.push(e);
      }).catch(function () {});
    })).then(function () { loadingMore = false; });
  }

  function chooseNext(from) {
    var pool = analyzed.filter(function (e) { return !played[e.url]; });
    if (!pool.length) { played = {}; pool = analyzed.slice(); }
    if (!from) return pool[Math.floor(Math.random()*pool.length)];
    var best = null, bestD = Infinity;
    pool.forEach(function (e) {
      var d = distance(from.sig, e.sig);
      if (d < bestD) { bestD = d; best = e; }
    });
    return best || pool[0];
  }

  function buildFrame(img) {
    work.width = subW; work.height = subH;
    wctx.fillStyle = BG;
    wctx.fillRect(0, 0, subW, subH);
    var frameAspect = (subW/2*CELL_W) / (subH/4*CELL_H);
    var ia = img.width / img.height;
    var w, h;
    if (ia > frameAspect) { w = subW; h = subW/ia*(CELL_W/CELL_H)*2; }
    else { h = subH; w = subH*ia/(CELL_W/CELL_H)/2; }
    w = Math.max(2, Math.round(w)); h = Math.max(2, Math.round(h));
    // crop a margin off the source, then overdraw by a pixel on each side so
    // no half-sampled background row survives at the frame edge
    var _cx = Math.round(img.width * 0.035), _cy = Math.round(img.height * 0.035);
    var _ox = Math.floor((subW - w) / 2) - 2, _oy = Math.floor((subH - h) / 2) - 2;
    wctx.drawImage(img, _cx, _cy, img.width - _cx * 2, img.height - _cy * 2,
                   _ox, _oy, w + 3, h + 3);

    var d = wctx.getImageData(0, 0, subW, subH).data;
    var tones = new Float32Array(subW*subH);
    for (var p = 0; p < subW*subH; p++) {
      var k = p*4;
      tones[p] = 0.2126*d[k] + 0.7152*d[k+1] + 0.0722*d[k+2];
    }
    var colors = new Float32Array(cols*rows*3);
    for (var cy = 0; cy < rows; cy++) {
      for (var cx = 0; cx < cols; cx++) {
        var r=0,g=0,b=0;
        for (var dy = 0; dy < 4; dy++) {
          for (var dx = 0; dx < 2; dx++) {
            var kk = ((cy*4+dy)*subW + (cx*2+dx))*4;
            r += d[kk]; g += d[kk+1]; b += d[kk+2];
          }
        }
        var ci = (cy*cols+cx)*3;
        colors[ci]=r/8; colors[ci+1]=g/8; colors[ci+2]=b/8;
      }
    }
    return { tones: tones, colors: colors };
  }

  function paint(p) {
    ctx.fillStyle = BG;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    if (!frameB) return;
    var A = frameA, B = frameB;
    var blending = A && p < 1;
    var e = p < 0.5 ? 2*p*p : 1 - Math.pow(-2*p+2, 2)/2;
    var mode = (!blending || e >= 0.5) ? modeB : modeA;
    var i, n;
    if (blending) {
      n = subW*subH;
      for (i = 0; i < n; i++) mixTones[i] = A.tones[i] + (B.tones[i]-A.tones[i])*e;
      n = cols*rows*3;
      for (i = 0; i < n; i++) mixColors[i] = A.colors[i] + (B.colors[i]-A.colors[i])*e;
    } else {
      mixTones.set(B.tones); mixColors.set(B.colors);
    }
    for (var cy = 0; cy < rows; cy++) {
      for (var cx = 0; cx < cols; cx++) {
        var ch, cellTone = 0;
        if (mode === "braille") {
          var code = 0;
          for (var dy = 0; dy < 4; dy++) {
            for (var dx = 0; dx < 2; dx++) {
              var sx = cx*2+dx, sy = cy*4+dy;
              var t = mixTones[sy*subW+sx];
              cellTone += t;
              if (t < (BAYER[sy&3][sx&3]+0.5)/16*255) code |= BRAILLE_BITS[dy][dx];
            }
          }
          ch = String.fromCharCode(0x2800 + code);
          if (code === 0) continue;
        } else {
          for (var ay = 0; ay < 4; ay++)
            for (var ax = 0; ax < 2; ax++)
              cellTone += mixTones[(cy*4+ay)*subW + (cx*2+ax)];
          cellTone /= 8;
          var idx = Math.min(RAMP.length-1, Math.floor(cellTone/255*RAMP.length));
          ch = RAMP[idx];
          if (ch === " ") continue;
        }
        var ci = (cy*cols+cx)*3;
        ctx.fillStyle = "rgb(" + (mixColors[ci]|0) + "," +
                        (mixColors[ci+1]|0) + "," + (mixColors[ci+2]|0) + ")";
        ctx.fillText(ch, cx*CELL_W, cy*CELL_H);
      }
    }
  }

  function pickStyle() {
    if (styleMode !== "mixed") return styleMode;
    return Math.random() < 0.5 ? "ascii" : "braille";
  }

  function advance() {
    var entry = chooseNext(current);
    if (!entry) return Promise.resolve();
    played[entry.url] = true;
    return getImage(entry).then(function (img) {
      frameA = frameB; modeA = modeB;
      frameB = buildFrame(img); modeB = pickStyle();
      current = entry;
      document.getElementById("idtag").textContent = entry.name;
      phase = frameA ? "trans" : "hold";
      phaseStart = performance.now();
      if (analyzed.length < playlist.length) fillPool(4);
    }).catch(function () {});
  }

  function loop(now) {
    requestAnimationFrame(loop);
    if (paused || !frameB) return;
    sampleQuality(now);
    var el = now - phaseStart;
    if (phase === "trans") {
      var p = Math.min(1, el / pace.trans);
      paint(p);
      if (p >= 1) { phase = "hold"; phaseStart = now; frameA = null; }
    } else {
      paint(1);
      if (el > pace.hold) advance();
    }
  }

  function start() {
    if (started) return;
    started = true;
    sizeGrid();
    advance().then(function () { requestAnimationFrame(loop); });
  }

  function rebuild() {
    sizeGrid();
    frameA = null; frameB = null;
    advance();
  }

  // Re-render the work already on screen at the new grid size.
  function resizeKeep() {
    sizeGrid();
    frameA = null;
    if (current && imgCache[current.url]) {
      frameB = buildFrame(imgCache[current.url]);
      phase = "hold";
      phaseStart = performance.now();
    } else {
      advance();
    }
  }

  // ---------- adaptive quality ----------
  // Measures real frame rate and trades character density for smoothness.
  function sampleQuality(now) {
    if (!autoQuality || detailSetting !== "auto") return;
    frameTimes.push(now);
    if (frameTimes.length > 90) frameTimes.shift();
    if (now < settleUntil || now - lastCheck < 2000 || frameTimes.length < 40) return;
    lastCheck = now;

    var span = frameTimes[frameTimes.length - 1] - frameTimes[0];
    var fps = (frameTimes.length - 1) / (span / 1000);
    var changed = false;

    if (fps < 26 && CELL_W < MAX_CELL) {          // struggling — coarsen
      CELL_W += 1; CELL_H = Math.round(CELL_W * 1.75); changed = true;
    } else if (fps > 55 && CELL_W > MIN_CELL) {   // headroom — refine
      CELL_W -= 1; CELL_H = Math.round(CELL_W * 1.75); changed = true;
    }

    if (changed) {
      frameTimes = [];
      settleUntil = now + 2500;                   // let it stabilise before judging again
      resizeKeep();
      var st = document.getElementById("status");
      if (st) st.textContent = playlist.length + " WORKS \u00B7 " +
        (CELL_W <= 6 ? "HIGH" : CELL_W <= 9 ? "STANDARD" : "LIGHT") + " DETAIL";
    }
  }

  function record() {
    if (recorder) return;
    var btn = document.getElementById("recBtn");
    var stream = canvas.captureStream(30);
    var mime = MediaRecorder.isTypeSupported("video/webm;codecs=vp9")
      ? "video/webm;codecs=vp9" : "video/webm";
    var chunks = [];
    recorder = new MediaRecorder(stream, { mimeType: mime, videoBitsPerSecond: 12000000 });
    recorder.ondataavailable = function (e) { if (e.data.size) chunks.push(e.data); };
    recorder.onstop = function () {
      var blob = new Blob(chunks, { type: "video/webm" });
      var a = document.createElement("a");
      a.href = URL.createObjectURL(blob);
      a.download = "pogo-sequence-" + Date.now() + ".webm";
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      recorder = null;
      btn.classList.remove("on"); btn.textContent = "RECORD 30s";
    };
    recorder.start();
    btn.classList.add("on");
    var left = 30;
    btn.textContent = "RECORDING " + left + "s";
    var tick = setInterval(function () {
      left--;
      btn.textContent = "RECORDING " + left + "s";
      if (left <= 0) { clearInterval(tick); if (recorder) recorder.stop(); }
    }, 1000);
  }

  document.getElementById("modeSel").addEventListener("change", function () { styleMode = this.value; });
  document.getElementById("paceSel").addEventListener("change", function () { pace = PACE[this.value]; });
  document.getElementById("detailSel").addEventListener("change", function () {
    detailSetting = this.value;
    if (detailSetting === "auto") {
      CELL_W = 8; CELL_H = 14;
      frameTimes = []; settleUntil = performance.now() + 2500;
    }
    rebuild();
  });
  document.getElementById("pauseBtn").addEventListener("click", function () {
    paused = !paused;
    this.classList.toggle("on", paused);
    this.textContent = paused ? "RESUME" : "PAUSE";
    if (!paused) phaseStart = performance.now();
  });

  function toggleClean(on) {
    document.body.classList.toggle("clean", on);
    document.getElementById("cleanBtn").classList.toggle("on", on);
    setTimeout(rebuild, 60);
  }
  document.getElementById("cleanBtn").addEventListener("click", function () {
    toggleClean(!document.body.classList.contains("clean"));
  });
  document.getElementById("exitClean").addEventListener("click", function () { toggleClean(false); });

  document.getElementById("fsBtn").addEventListener("click", function () {
    if (!document.fullscreenElement) {
      (document.documentElement.requestFullscreen || function(){})
        .call(document.documentElement);
    } else if (document.exitFullscreen) {
      document.exitFullscreen();
    }
  });
  document.addEventListener("fullscreenchange", function () {
    var on = !!document.fullscreenElement;
    document.getElementById("fsBtn").classList.toggle("on", on);
    document.getElementById("fsBtn").textContent = on ? "EXIT FULLSCREEN" : "FULLSCREEN";
    setTimeout(rebuild, 120);
  });

  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape" && document.body.classList.contains("clean")) toggleClean(false);
  });

  var rt;
  window.addEventListener("resize", function () {
    clearTimeout(rt);
    rt = setTimeout(function () { if (started) rebuild(); }, 250);
  });

  if (/[?&]embed/.test(Q)) document.body.classList.add("embed");
  ["Dark","Paper","White"].forEach(function (n) {
    var b = document.getElementById("bg" + n);
    if (b) b.addEventListener("click", function () { applyTheme(n.toLowerCase()); });
  });
  applyTheme(theme);

  sizeGrid();
  loadArchive();
})();
</script>

<script>
(function () {
  var drops = document.querySelectorAll(".navdrop");
  Array.prototype.forEach.call(drops, function (d) {
    var t = d.querySelector(".navtrigger");
    t.addEventListener("click", function (e) {
      e.stopPropagation();
      var wasOpen = d.classList.contains("open");
      Array.prototype.forEach.call(drops, function (x) { x.classList.remove("open"); });
      if (!wasOpen) d.classList.add("open");
    });
  });
  document.addEventListener("click", function () {
    Array.prototype.forEach.call(drops, function (d) { d.classList.remove("open"); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") {
      Array.prototype.forEach.call(drops, function (d) { d.classList.remove("open"); });
    }
  });

})();
</script>

<script>
(function () {
  // Splash: shown once per session so returning to a page feels instant
  var sp = document.getElementById("splash");
  if (sp) {
    var seen = false;
    try { seen = sessionStorage.getItem("pogo-splash") === "1"; } catch (e) {}
    if (seen) { sp.parentNode.removeChild(sp); }
    else {
      try { sessionStorage.setItem("pogo-splash", "1"); } catch (e) {}
      setTimeout(function () {
        sp.classList.add("gone");
        setTimeout(function () { if (sp.parentNode) sp.parentNode.removeChild(sp); }, 500);
      }, 900);
    }
  }
  // Mark the active tab from the filename
  var here = (location.pathname.split("/").pop() || "index.html").replace(/\.html$/, "");
  if (!here) here = "index";
  var tabs = document.querySelectorAll(".appbar a");
  Array.prototype.forEach.call(tabs, function (a) {
    if (a.getAttribute("data-page") === here) a.classList.add("here");
  });
})();
</script>
